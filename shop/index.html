<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./output.css" />
    <title>Product</title>
  </head>
  <body>
    <!-- Global Container -->
    <div class="flex items-center justify-center min-h-screen bg-slate-100">
      <!-- Card Container -->
      <div
        class="flex flex-col bg-white p-6 rounded-2xl shadow-2xl md:flex-row gap-5"
      >
        <!-- Image Div -->
        <div>
          <img
            src="./images/headphone.png"
            alt="headphone"
            class="hover:scale-105 duration-300 mx-auto w-60"
          />
        </div>
        <!-- Content -->
        <div class="flex flex-col gap-2">
          <!-- Label & Title container -->
          <div class="flex flex-col gap-2 text-center md:text-left">
            <div>
              <div
                class="text-white inline-block text-sm bg-black rounded-full px-3 py-1"
              >
                Free shipping
              </div>
            </div>
            <!-- Title - product name -->
            <div class="max-w-sm text-xl font-inter">
              Razer Kraken Kitty EDT Gaming Headset Quartz
            </div>
            <!-- Price container -->
            <div>
              <div class="text-xs line-through">$700</div>
              <div class="font-inter text-3xl font-extrabold">$599</div>
              <div class="text-xs text-slate-400">
                The offer is valid until April 3 or as long as stock lasts!
              </div>
            </div>
            <button class="bg-blue-400 rounded-md text-white text-xs py-3">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ٍEmail Subscribe!</title>
  </head>
  <body>
    <div
      class="bg-[#A4B465] text-white flex justify-center items-center h-screen"
    >
      <div
        class="bg-[#626F47] md:px-4 py-4 md:py-0 rounded-2xl flex flex-col justify-center items-center max-w-64 md:flex-row md:max-w-none"
      >
        <div class="md:flex-row rounded-xl md:rounded-l-xl md:rounded-r-none">
          <img
            class="object-contain h-80 md:h-64 transform hover:scale-105 hover:rounded-xl rounded-xl md:my-4 md:rounded-l-xl md:rounded-r-none rounded-b-none"
            src="./image.jpg"
            alt="beans"
          />
        </div>
        <div class="flex flex-col px-6 md:px-4 py-4">
          <p class="text-white font-serif font-normal text-2xl">
            Get diet and fitness tips in your inbox
          </p>
          <p class="text-white font-serif text-xs font-normal py-6">
            Eat Better and exercise better. Sign up for the
            <br />Diet&Fitness newsletter.
          </p>
          <div class="flex flex-col gap-2 flex-shrink-0 md:flex-row">
            <input
              type="text"
              class="w-full md:w-1/2 px-2 bg-[#626F47] border-2 border-[#A4B465] rounded-md p-2 text-xs placeholder-[#A4B465] focus:placeholder-transparent focus:outline-none focus:border-[#F0BB78] focus:bg-[#F5ECD5]"
              placeholder="Enter your email address"
            />
            <button
              class="bg-[#9AD872] text-[#626F47] font-bold rounded-lg text-xs md:w-1/2 py-2"
            >
              Subscribe!
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
